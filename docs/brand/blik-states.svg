<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590"><style><![CDATA[.brand-mascot { display: block; flex: none; overflow: visible; }
.blik-body { transform-origin: 60px 120px; animation: blik-breathe 7s ease-in-out infinite; }
.blik-flap { transform-origin: 60px 34px; }
.blik-eyes { transform-origin: 60px 83px; }
.blik-idle .blik-eyes { animation: blik-blink 6s ease-in-out infinite; }
.blik-deal .blik-flap { animation: blik-flap .7s ease-in-out 3; }
.blik-deal .blik-cards { animation: blik-cards .7s ease-in-out 3; }
.blik-surprised .blik-body { animation: blik-surprise .35s ease-out; }
.blik-celebrate .blik-body { animation: blik-celebrate var(--blik-ritual, .65s) ease-in-out 2; }
.blik-celebrate .blik-flap { animation: blik-flap var(--blik-ritual, .65s) ease-in-out 2; }
.blik-sad .blik-body { transform: rotate(-7deg) translateY(3px); animation: none; }
.blik-thinking .blik-pupils { transform: translate(2px, -2px); }
.blik-thinking .blik-body { animation: blik-think 3s ease-in-out infinite; }
.blik-quiet *, .blik-quiet { animation: none !important; transition: none !important; }
.blik-quiet.blik-deal .blik-flap { transform: translateY(-5px) rotate(-8deg); }
.blik-quiet.blik-deal .blik-cards { transform: translateY(-6px); }
.blik-celebrate .blik-brow { transform: translateY(-3px); }
.brand-settings { display: flex; align-items: center; gap: 8px; font-size: 12px; position: relative; }
.brand-settings summary::marker, .emote-picker summary::marker { content: ''; }
.brand-sound-toggle { display: grid; place-items: center; min-width: 44px; min-height: 44px; border-radius: 12px; color: var(--accent); background: #ffb23f0b; }
.brand-settings summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
.brand-options { display: grid; gap: 12px; min-width: 180px; font-size: 12px; }
.brand-options label { display: flex; gap: 8px; align-items: center; min-height: 32px; }
.brand-options input[type=range] { width: 110px; accent-color: var(--accent); }
.brand-settings details[open] > .brand-options { position: absolute; z-index: 1300; top: 48px; right: 0; padding: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); }
.brand-welcome { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.brand-welcome-copy { flex: 1; color: var(--muted); font-size: 12px; }
.brand-welcome-copy strong { display: block; color: var(--ink); margin-bottom: 3px; }
.home > .brand-settings { align-self: center; margin-bottom: 12px; }
@keyframes blik-breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
@keyframes blik-blink { 0%,43%,48%,100% { transform: scaleY(1); } 45%,46% { transform: scaleY(.12); } }
@keyframes blik-flap { 0%,100% { transform: rotate(0); } 45% { transform: translateY(-5px) rotate(-12deg); } }
@keyframes blik-cards { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-9px); } }
@keyframes blik-surprise { 0% { transform: scale(.96); } 45% { transform: translateY(-5px) scale(1.05); } 100% { transform: none; } }
@keyframes blik-celebrate { 0%,100% { transform: rotate(0); } 25% { transform: translateY(-7px) rotate(-8deg); } 70% { transform: translateY(-3px) rotate(7deg); } }
@keyframes blik-think { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { .brand-mascot * { animation: none !important; transition: none !important; } }
.emote-icon { width: 22px; height: 22px; flex: none; }
.emote-picker { position: relative; font-size: 12px; flex: none; }
.emote-picker > summary { min-height: 44px; display: flex; align-items: center; padding: 0 10px; cursor: pointer; color: var(--ink); }
.emote-options { position: absolute; top: 100%; right: 0; z-index: 1400; width: 260px; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); }
.emote-options button { display: flex; align-items: center; gap: 7px; min-height: 48px; text-align: left; background: #ffb23f0c; padding: 8px; border-radius: 10px; }
.emote-options button:disabled { opacity: .45; }
.emote-options small { grid-column: 1/-1; color: var(--muted); padding: 4px; }
.emote-bubble { display: inline-flex; align-items: center; gap: 6px; max-width: 140px; white-space: nowrap; padding: 7px 10px; border-radius: 12px; background: #f3efe6; color: #182235; border: 1px solid #ffb23f; box-shadow: 0 5px 18px #0004; font-size: 12px; font-weight: 700; animation: emote-pop .24s ease-out; }
.emote-bubble > span { overflow: hidden; text-overflow: ellipsis; }
.emote-bubble .emote-icon { color: #87520c; }
.emote-anchor { position: absolute; z-index: 700; translate: -50% 0; pointer-events: none; }
.emote-anchor.is-mine { translate: -50% -100%; }
.lobby-emotes { position: relative; min-height: 0; }
.lobby-emote { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 11px; }
.lobby-emote > b { max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
.brand-results { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.brand-result-signature { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 9px; letter-spacing: .13em; }
.brand-result-signature i { width: 22px; height: 2px; background: var(--accent); }
.brand-result-note { font-size: 13px; color: var(--muted); margin: 0; }
.brand-scoreboard { list-style: none; padding: 0; margin: 10px 0; width: 100%; }
.brand-scoreboard li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.brand-scoreboard li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-scoreboard .is-winner { color: var(--accent); }
.brand-result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.brand-results .win-title { font-size: clamp(24px, 5vw, 38px); margin: 0; }
.brand-playground { padding: 24px; max-width: 1440px; margin: auto; }
.brand-playground > header { display: flex; justify-content: space-between; align-items: center; }
.brand-mascot-grid { display: flex; flex-wrap: wrap; gap: 22px; }
.brand-mascot-grid figure { margin: 20px 0; text-align: center; }
.brand-mascot-grid figcaption { font-size: 12px; color: var(--muted); }
.brand-sound-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.brand-emote-demo { padding: 30px 0 10px; }
.emote-quiet { animation: none; }
.command-table .win-panel { max-height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.topbar > .emote-picker { margin-left: auto; }
.topbar-menu { margin-left: 0; min-width: 44px; padding-inline: 0; }
.topbar-room { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.menu > .brand-options { padding: 8px 12px; }
@keyframes emote-pop { from { transform: translateY(4px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 699px) { .emote-anchor .emote-bubble { max-width: 100px; padding: 5px 7px; font-size: 10px; } .emote-anchor .emote-icon { width: 18px; height: 18px; } .topbar .emote-picker > summary { padding-inline: 5px; font-size: 11px; } .brand-result-actions { flex-direction: column; width: 100%; } }
@media (prefers-reduced-motion: reduce) { .emote-bubble { animation: none; } }
@media (max-width: 699px) { .topbar { gap: 6px; padding-left: 10px; } .topbar-brand { font-size: 16px; } .topbar-room { font-size: 11px; } .conn-pill { position: absolute; top: 52px; right: 8px; } }
@media (max-height: 479px) { .brand-results > .brand-mascot { width: 40px; height: 47px; } .brand-results .win-title { font-size: 22px; } }
]]></style><rect width="720" height="590" rx="24" fill="#10141f"/><text x="40" y="42" fill="#ffb23f" font-family="Arial" font-weight="700" font-size="23">BALÍK / BLIK</text><text x="40" y="67" fill="#98a1b4" font-family="Arial" font-size="12">Statický render skutečné SVG komponenty · reduced motion</text><g transform="translate(40 95)"><svg class="brand-mascot blik-idle blik-quiet" data-state="idle" viewBox="0 0 120 140" width="140" height="163.33333333333334" style="--blik-ritual:0.65s" role="img" aria-label="BLIK · idle"><ellipse class="blik-shadow" cx="60" cy="129" rx="37" ry="6" fill="#000" opacity=".2"></ellipse><g class="blik-body"><g class="blik-cards" fill="#f3efe6" stroke="#182235" stroke-width="3"><rect x="30" y="23" width="54" height="77" rx="7" transform="rotate(-9 57 61)"></rect><rect x="37" y="19" width="54" height="77" rx="7" transform="rotate(8 64 58)"></rect><path d="M49 35h27M49 44h18" stroke="#ffb23f" stroke-linecap="round"></path></g><path d="M17 54q0-12 13-12h60q13 0 13 12v61q0 12-13 12H30q-13 0-13-12Z" fill="#182235" stroke="#f3efe6" stroke-width="2.5"></path><path d="M25 59v53q0 7 8 7h54" fill="none" stroke="#39465b" stroke-width="2"></path><g class="blik-flap"><path d="M17 52V41q0-11 13-11h60q13 0 13 11v11L67 67a18 18 0 0 1-14 0Z" fill="#ffb23f" stroke="#182235" stroke-width="3"></path><path d="M48 43h24" stroke="#2a1a00" stroke-width="3" stroke-linecap="round"></path></g><g class="blik-eyes"><rect x="34" y="73" width="19" height="20" rx="9" fill="#f3efe6"></rect><rect x="67" y="73" width="19" height="20" rx="9" fill="#f3efe6"></rect><g class="blik-pupils" fill="#182235"><rect x="43" y="78" width="7" height="11" rx="3.5"></rect><rect x="70" y="78" width="7" height="11" rx="3.5"></rect></g></g><path d="M49 91q11 11 22 0" fill="none" stroke="#f3efe6" stroke-width="2.5" stroke-linecap="round"></path><path class="blik-brow" d="m31 69 22 3m15 0 20-7" stroke="#ffb23f" stroke-width="3" stroke-linecap="round"></path><path d="M52 112h16" stroke="#ffb2